<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temp Master Dashboard</title>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://temp-master.fly.dev; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'">

  <!-- Bootstrap 3.4.1 CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css"
        integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu"
        crossorigin="anonymous">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-default navbar-fixed-top">
    <div class="container-fluid">
      <div class="navbar-header">
        <a class="navbar-brand" href="#">Temp Master Dashboard</a>
      </div>
      <ul class="nav navbar-nav">
        <li class="active"><a href="/">Dashboard</a></li>
      </ul>
      <div class="navbar-status pull-right">
        <span id="connection-status" class="label label-success">Connected</span>
      </div>
    </div>
  </nav>

  <div class="container-fluid">

    <!-- Controls -->
    <div class="panel panel-default">
      <div class="panel-body">
        <form class="form-inline">
          <div class="form-group form-group-spaced">
            <label for="time-scale-select" class="control-label-spaced">Time Range:</label>
            <select id="time-scale-select" class="form-control">
              <option value="hour">Last Hour</option>
              <option value="day" selected>Last 24 Hours</option>
              <option value="week">Last 7 Days</option>
              <option value="month">Last 30 Days</option>
              <option value="year">Last Year</option>
            </select>
          </div>
          <button type="button" id="btn-refresh" class="btn btn-primary">Refresh Data</button>
          <button type="button" id="btn-backup" class="btn btn-default">Download Backup</button>
        </form>
      </div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar" class="alert alert-info js-hidden">
      <span id="status-meters-count">Monitoring 0 meters</span>
      <span class="pull-right" id="status-last-refresh"></span>
    </div>

    <!-- Rate Limit Warning -->
    <div id="rate-limit-warning" class="alert alert-warning js-hidden">
      <strong>Rate Limited.</strong>
      <span id="rate-limit-text">SwitchBot API rate limit reached.</span>
    </div>

    <!-- Loading -->
    <div id="loading">
      <p class="text-muted">Loading temperature data...</p>
    </div>

    <!-- Error -->
    <div id="error" class="alert alert-danger js-hidden">
      <strong>Error.</strong> <span id="error-text">Failed to fetch data.</span>
    </div>

    <!-- Meters Container -->
    <div id="meters-container"></div>

    <!-- Footer -->
    <footer>
      Temp Master Dashboard v1.0 - Built with jQuery 3 + Bootstrap 3
    </footer>

  </div>

  <!-- jQuery 3.7.1 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
          integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs"
          crossorigin="anonymous"></script>

  <!-- Chart.js 4.5.0 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"
          integrity="sha384-XcdcwHqIPULERb2yDEM4R0XaQKU3YnDsrTmjACBZyfdVVqjh6xQ4/DCMd7XLcA6Y"
          crossorigin="anonymous"></script>

  <script src="app.js"></script>

</body>
</html>
