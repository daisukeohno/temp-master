[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = ["Devin AI <158243242+devin-ai-integration[bot]@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.139.2"}
psycopg = {extras = ["binary"], version = "^3.3.2"}
httpx = "^0.28.1"
python-dotenv = "^1.2.2"
aiosqlite = "^0.22.1"
# 以下は推移的依存だが、既知脆弱性の修正版を強制するため下限を明示指定
starlette = ">=1.3.1"
python-multipart = ">=0.0.31"
urllib3 = ">=2.7.0"
idna = ">=3.15"
click = ">=8.3.3"
pygments = ">=2.20.0"
pydantic-settings = ">=2.14.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
